name: 🧩 Görev
description: Yapılacak bir iş kalemi (bir bölüm, bir ekran, bir altyapı parçası). Bir görev = bir kişi = bir PR.
title: "[Görev] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Görevi tek bir konuya odakla: bir issue tek bir PR ile kapanabilmeli. Kurallar: [CLAUDE.md](https://github.com/teknofest-gumushane/gu_teknofest/blob/main/CLAUDE.md), akış: [CONTRIBUTING.md](https://github.com/teknofest-gumushane/gu_teknofest/blob/main/CONTRIBUTING.md).

        **Görevi, onu hiç görmemiş biri ya da bir yapay zekâ başka kimseye sormadan yapabilecek kadar ayrıntılı yaz.** Adları koddan doğrula, açık soru bırakma (kararı al ve "Karar" diye yaz), arayüz metinlerini ARB anahtarlarıyla ver. Örnek: [#13](https://github.com/teknofest-gumushane/gu_teknofest/issues/13). Yapay zekâ ile yazıyorsan `tf-issue` skill'ini kullan; gövdenin başına konacak not ve başlık sırası orada.
  - type: textarea
    id: ne
    attributes:
      label: Ne yapılacak?
      description: İki üç cümleyle sonuç. "Nasıl" değil "ne".
      placeholder: Projeler bölümü, sahte veriden gelen projeleri etiket filtresi ve aramayla kart ızgarasında gösterir.
    validations:
      required: true
  - type: textarea
    id: durum
    attributes:
      label: Şu anki durum
      description: Koddaki ilgili dosya, sınıf, alan ve sahte veri. Bugün ne var, ne eksik? Kullanılacak hazır parçalar hangi görevden geliyor?
      placeholder: |
        - `lib/features/landing/view/section/projects_section.dart` bugün `TfComingSoon` çiziyor.
        - Repository: `projectRepository.fetchProjects()` → silinmemiş projeler, `displayOrder`'a göre.
        - Sahte veri: `assets/mock/projects.json` (4 kayıt, biri silinmiş).
  - type: textarea
    id: hedef
    attributes:
      label: Hedef davranış
      description: Numaralı, denetlenebilir kurallar. Verilmiş kararları başta "Karar" diye yaz. Açık soru bırakma.
      placeholder: |
        **Karar:** Tamamlanan projeler de listelenir, "Tamamlandı" etiketiyle.

        1. Durum sırası: hata → yükleniyor → boş → dolu.
        2. Etiket çipleri tek seçimlidir; "Tümü" varsayılan.
    validations:
      required: true
  - type: textarea
    id: sozlesme
    attributes:
      label: Sözleşme (adlar ve imzalar)
      description: Yazılacak sınıfların imzaları, eklenecek token'lar (değerleriyle) ve ARB anahtarları (Türkçe metinleriyle). Yoksa "Yok".
      placeholder: |
        ```dart
        // lib/features/landing/provider/projects_state.dart
        final class ProjectsState extends Equatable { … }
        ```

        | Anahtar | Metin |
        |---|---|
        | `projectsEmptyTitle` | Henüz proje eklenmedi. |
  - type: textarea
    id: adimlar
    attributes:
      label: Uygulama adımları
      description: Sırayla, dosya yollarıyla. Dikkat edilecek kuralları da yaz.
      placeholder: |
        1. ARB anahtarlarını ekle, `bash tool/codegen.sh`.
        2. `projects_state.dart` ve `projects_view_model.dart` yaz.
        3. …
  - type: textarea
    id: test
    attributes:
      label: Test planı
      description: Test dosyası başına denenecek durumlar ve kurulum (hangi fake, hangi yardımcı).
      placeholder: |
        `test/features/landing/section/projects_section_test.dart` (yeni):
        - Dolu: üç kart, etiket çipleri, arama kutusu.
        - Hata: mesaj + "Tekrar dene".
  - type: dropdown
    id: alan
    attributes:
      label: Alan
      options:
        - Genel sayfa — bölüm
        - Genel sayfa — üst bar / alt bilgi / pencere
        - Admin paneli
        - Admin girişi (auth)
        - Veri katmanı (tf_data)
        - Tema / ortak widget
        - Araçlar / CI
        - Belgeler
    validations:
      required: true
  - type: dropdown
    id: bolum
    attributes:
      label: Bölüm
      description: Genel sayfa görevi değilse "Yok".
      options:
        - Yok
        - Hero
        - Hakkımızda
        - Projeler
        - Etkinlikler
        - Galeri
        - Ekibimiz
        - Sosyal medya
        - Takıma Katıl formu
        - Alt bilgi
    validations:
      required: true
  - type: textarea
    id: kabul
    attributes:
      label: Kabul ölçütleri
      description: Görev ne zaman bitmiş sayılır? Her madde denetlenebilir olsun.
      placeholder: |
        - [ ] Hata, yükleniyor, boş ve dolu durumlarının dördü de var
        - [ ] 320 / 768 / 1024 / 1440 genişliklerinde taşma yok
        - [ ] Metinler ARB'de; renk, boşluk ve ölçüler token
        - [ ] View model, state ve bölüm için test yazıldı
        - [ ] `bash tool/quality_gate.sh` yeşil
    validations:
      required: true
  - type: textarea
    id: dosyalar
    attributes:
      label: Dokunulacak dosyalar
      description: Yeni dosyaları "(yeni)" diye işaretle. İki görev aynı dosyaya dokunuyorsa birini diğerine bağla (D-31'deki ortak dosyalar hariç).
      placeholder: |
        - lib/features/landing/view/section/projects_section.dart
        - lib/features/landing/provider/projects_view_model.dart (yeni)
        - lib/l10n/app_tr.arb
  - type: textarea
    id: kapsam-disi
    attributes:
      label: Kapsam dışı
      description: Bu görevde yapılmayacak, karıştırılmaması gereken şeyler.
  - type: input
    id: referans
    attributes:
      label: Referans
      description: docs/analiz.md'deki ilgili başlık ya da karar numarası.
      placeholder: docs/analiz.md §1 "Projeler" · D-12
  - type: textarea
    id: bagimlilik
    attributes:
      label: Bağımlı olduğu görevler
      description: Her biri için görev numarası ve o görevin ne sağladığı. Yoksa "Yok".
      placeholder: |
        - #5 → `TfCard`, `TfTag`, `TfResponsiveGrid`
        - #6 → `TfNetworkImage`
