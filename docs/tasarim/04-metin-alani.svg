<text x="88" y="39" font-size="18" font-weight="600" fill="#1B3C73">Metin alanı: TfTextField</text>
<text x="976" y="32" font-size="10" fill="#1B3C73" fill-opacity=".7" text-anchor="end">Şematik taslak: yerleşimi ve durumları gösterir.</text>
<text x="976" y="46" font-size="10" fill="#1B3C73" fill-opacity=".7" text-anchor="end">Ölçü ve renk için token, davranış için issue geçerlidir.</text>
