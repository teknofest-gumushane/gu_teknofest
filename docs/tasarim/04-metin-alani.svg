<circle cx="872" cy="186.5" r="8" fill="#F47A1F" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="872" y="189.7" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="24" y="382" font-size="11.5" font-weight="600" fill="#1B3C73">Notlar</text>
<circle cx="32" cy="398.4" r="8" fill="#F47A1F"/>
<text x="32" y="401.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="48" y="402" font-size="10.5" font-weight="400" fill="#0F172A">Etiket alanın üstündedir. hideLabel: true ise görünmez ama ekran okuyucuya yine bildirilir (arama kutusu).</text>
<circle cx="32" cy="417.4" r="8" fill="#F47A1F"/>
<text x="32" y="420.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="48" y="421" font-size="10.5" font-weight="400" fill="#0F172A">Odak: kenarlık primary ve kalın (TfSizes.focusRing). Hata: kenarlık danger, altında hata metni; uzun metin sarar.</text>
<circle cx="32" cy="436.4" r="8" fill="#F47A1F"/>
<text x="32" y="439.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="48" y="440" font-size="10.5" font-weight="400" fill="#0F172A">Devre dışı (enabled: false): yazı soluktur, alan düzenlenemez. Gönderim sürerken form alanları bu haldedir.</text>
<circle cx="32" cy="455.4" r="8" fill="#F47A1F"/>
<text x="32" y="458.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="48" y="459" font-size="10.5" font-weight="400" fill="#0F172A">Temizle düğmesi yalnızca controller ve onClear birlikte verildiyse ve alanda metin varken görünür.</text>
<circle cx="32" cy="474.4" r="8" fill="#F47A1F"/>
<text x="32" y="477.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="48" y="478" font-size="10.5" font-weight="400" fill="#0F172A">Hata metinleri FormFieldErrorX.message(l10n) ile ARB&#x27;den gelir; hata belirince ekran okuyucuya duyurulur.</text>
