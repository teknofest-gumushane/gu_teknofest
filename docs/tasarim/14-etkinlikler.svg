<text x="48" y="590" font-size="10.5" font-weight="400" fill="#0F172A">Yaklaşan / geçmiş ayrımı view model&#x27;de AppClock ile yapılır. Yaklaşanlar en yakın tarih önce, geçmişler en yeni önce.</text>
