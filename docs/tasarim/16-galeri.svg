<text x="48" y="582" font-size="10.5" font-weight="400" fill="#0F172A">Izgara 1 / 2 / 3 sütundur; görseller aynı oranda (4:3) kırpılır; sıra displayOrder. Sahte veride renkli kutu çizilir (D-28).</text>
<circle cx="32" cy="597.4" r="8" fill="#F47A1F"/>
<text x="32" y="600.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="48" y="601" font-size="10.5" font-weight="400" fill="#0F172A">Başlık şeridi masaüstünde üzerine gelince (kart 4 px yükselir) ya da klavye odağında belirir; dar ekranda hep görünür.</text>
<circle cx="32" cy="616.4" r="8" fill="#F47A1F"/>
<text x="32" y="619.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="48" y="620" font-size="10.5" font-weight="400" fill="#0F172A">Karoya dokunma, Enter ya da Space görsel penceresini (#8) o görselden açar. Odak çerçevesi görünür olmalıdır.</text>
<circle cx="32" cy="635.4" r="8" fill="#F47A1F"/>
<text x="32" y="638.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="48" y="639" font-size="10.5" font-weight="400" fill="#0F172A">Durum sırası: hata (tekrar dene), yükleniyor, boş, dolu.</text>
