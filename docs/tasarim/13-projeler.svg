<circle cx="32" cy="560.4" r="8" fill="#F47A1F"/>
<text x="32" y="563.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="48" y="564" font-size="10.5" font-weight="400" fill="#0F172A">Etiket çipleri tek seçimlidir; &quot;Tümü&quot; varsayılandır. Çipler projelerdeki etiketlerden türetilir, Türkçe alfabetik sırayla.</text>
<circle cx="32" cy="579.4" r="8" fill="#F47A1F"/>
<text x="32" y="582.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="48" y="583" font-size="10.5" font-weight="400" fill="#0F172A">Arama ad ve açıklamada, Türkçe duyarlı arar; filtreyle birlikte çalışır. Temizle düğmesi yalnızca metin varken görünür.</text>
<circle cx="32" cy="598.4" r="8" fill="#F47A1F"/>
<text x="32" y="601.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="48" y="602" font-size="10.5" font-weight="400" fill="#0F172A">Görsel yolu yoksa ya da sahte verideyse: yoldan türetilen renkte, üstünde başlığı yazan kutu çizilir (D-28).</text>
<circle cx="32" cy="617.4" r="8" fill="#F47A1F"/>
<text x="32" y="620.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="48" y="621" font-size="10.5" font-weight="400" fill="#0F172A">Tamamlanan projede &quot;Tamamlandı&quot; etiketi olur. Eşleşme yoksa: &quot;Aramanıza uyan proje bulunamadı.&quot; ve &quot;Filtreleri temizle&quot;.</text>
<circle cx="32" cy="636.4" r="8" fill="#F47A1F"/>
<text x="32" y="639.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="48" y="640" font-size="10.5" font-weight="400" fill="#0F172A">Durum sırası: hata (tekrar dene), yükleniyor, boş, dolu. Sütun sayısı: 1 / 2 / 3.</text>
</svg>
