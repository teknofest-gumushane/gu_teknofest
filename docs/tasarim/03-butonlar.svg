<text x="48" y="565" font-size="10.5" font-weight="400" fill="#0F172A">Odak çerçevesi açık zeminde deep, mor zeminde onBrand rengindedir (karar). Tab ile odaklanır; Enter ve Space çalıştırır.</text>
