<circle cx="32" cy="599.4" r="8" fill="#F47A1F"/>
<text x="32" y="602.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="48" y="603" font-size="10.5" font-weight="400" fill="#0F172A">TfIconButton TfSizes.tapTarget çapındadır; label zorunludur: hem ipucu hem ekran okuyucu etiketi olur.</text>
<circle cx="32" cy="618.4" r="8" fill="#F47A1F"/>
<text x="32" y="621.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="48" y="622" font-size="10.5" font-weight="400" fill="#0F172A">filled sosyal medya butonlarında kullanılır: zemin primary, üzerine gelince accent. Harfler yer tutucudur.</text>
