<text x="48" y="580" font-size="10.5" font-weight="400" fill="#0F172A">Yerleşim yukarıdan aşağı: isteğe bağlı üst bilgi, görsel, görselin başlığı ve açıklaması, gezinme satırı.</text>
<circle cx="32" cy="595.4" r="8" fill="#F47A1F"/>
<text x="32" y="598.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="48" y="599" font-size="10.5" font-weight="400" fill="#0F172A">Uçlarda başa sarmaz: ilk görselde &quot;önceki&quot;, son görselde &quot;sonraki&quot; düğmesi devre dışıdır.</text>
<circle cx="32" cy="614.4" r="8" fill="#F47A1F"/>
<text x="32" y="617.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="48" y="618" font-size="10.5" font-weight="400" fill="#0F172A">Sol ok ve sağ ok tuşları da görseli değiştirir. Sayaç &quot;3 / 7&quot; biçimindedir (ARB, ICU); showCounter: false ile kapanır.</text>
<circle cx="32" cy="633.4" r="8" fill="#F47A1F"/>
<text x="32" y="636.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="48" y="637" font-size="10.5" font-weight="400" fill="#0F172A">Tek görsel varsa gezinme düğmeleri ve sayaç çizilmez; liste boşsa pencere hiç açılmaz.</text>
<circle cx="32" cy="652.4" r="8" fill="#F47A1F"/>
<text x="32" y="655.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="48" y="656" font-size="10.5" font-weight="400" fill="#0F172A">Görsel kırpılmadan sığar (contain). Görselin başlığı ya da açıklaması boşsa o satır yer kaplamaz.</text>
