<text x="32" y="499.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="48" y="500" font-size="10.5" font-weight="400" fill="#0F172A">Arkada bulanıklık yok: yalnızca colors.scrim renkli karartma (D-33).</text>
<circle cx="32" cy="515.4" r="8" fill="#F47A1F"/>
<text x="32" y="518.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="48" y="519" font-size="10.5" font-weight="400" fill="#0F172A">Başlık satırı sabittir: solda başlık, sağda kapat düğmesi. İçerik ekrandan uzunsa yalnızca gövde kaydırılır.</text>
<circle cx="32" cy="534.4" r="8" fill="#F47A1F"/>
<text x="32" y="537.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="48" y="538" font-size="10.5" font-weight="400" fill="#0F172A">Üç kapanma yolu: kapat düğmesi, Esc, dışarı tıklama. barrierDismissible: false ise dışarı tıklama kapatmaz.</text>
<circle cx="32" cy="553.4" r="8" fill="#F47A1F"/>
<text x="32" y="556.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="48" y="557" font-size="10.5" font-weight="400" fill="#0F172A">Genişlik en çok TfSizes.dialogMaxWidth; dar ekranda kenarlardan pageGutter kadar boşluk kalır.</text>
<circle cx="32" cy="572.4" r="8" fill="#F47A1F"/>
<text x="32" y="575.6" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="48" y="576" font-size="10.5" font-weight="400" fill="#0F172A">Açıkken klavye odağı pencerede kalır; kapanınca pencereyi açan öğeye döner. Ekran okuyucuya pencere olarak bildirilir.</text>
