<text x="48" y="602" font-size="10.5" font-weight="400" fill="#0F172A">Üçü de dar bir sütunda (240 px) ve 320 px ekranda taşmaz: metin sarar, genişlik TfSizes.stateMaxWidth ile sınırlıdır.</text>
