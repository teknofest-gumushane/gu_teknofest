<text x="48" y="526" font-size="10.5" font-weight="400" fill="#0F172A">Hata: mesaj verilmezse &quot;İçerik yüklenemedi. Lütfen tekrar deneyin.&quot; yazar; onRetry verilmezse buton hiç çizilmez.</text>
