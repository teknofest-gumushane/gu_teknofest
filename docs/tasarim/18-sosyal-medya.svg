<text x="48" y="470" font-size="10.5" font-weight="400" fill="#0F172A">Sıra sabittir: Instagram, WhatsApp, YouTube, LinkedIn. Adresi boş ya da geçersiz olan hesabın düğmesi çizilmez.</text>
<circle cx="32" cy="485.4" r="8" fill="#F47A1F"/>
