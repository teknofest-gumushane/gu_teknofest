<text x="48" y="508" font-size="10.5" font-weight="400" fill="#0F172A">Düğme hesabı yeni sekmede açar; açılamazsa &quot;Bağlantı açılamadı.&quot; bildirimi çıkar. Etiketler ARB&#x27;den gelir.</text>
