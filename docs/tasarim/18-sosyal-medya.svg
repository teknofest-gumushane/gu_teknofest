<text x="48" y="489" font-size="10.5" font-weight="400" fill="#0F172A">Hiç adres yoksa bölüm kaybolmaz; &quot;Hesaplarımız yakında burada.&quot; yazar. Bugün sabitler boş olduğu için bu hal görünür.</text>
<circle cx="32" cy="504.4" r="8" fill="#F47A1F"/>
