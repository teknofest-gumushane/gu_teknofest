name: gu_teknofest
description: "Gümüşhane Üniversitesi Teknofest Kulübü web sitesi (Flutter web + Firebase)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# ─────────────────────────────────────────────────────────────────────────────
# Paket ekleme kuralı
#   1. Sürüm elle yazılmaz:  flutter pub add <paket>   (dev için: dev:<paket>)
#   2. Eklenen satır aşağıdaki uygun kategoriye taşınır, yanına amacı yazılır.
#   3. Kod üreten bir paket eklendiyse:  bash tool/codegen.sh
# Betiklerin kullanımı: tool/README.md
# ─────────────────────────────────────────────────────────────────────────────

# ── Yerel paketler (workspace) ───────────────────────────────────────────────
workspace:
  - packages/tf_data

dependencies:
  # ── Flutter SDK ────────────────────────────────────────────────────────────
  flutter:
    sdk: flutter

  # ── Yerelleştirme (ARB, şimdilik yalnız TR) ────────────────────────────────
  flutter_localizations:
    sdk: flutter
  intl: any # sürümünü flutter_localizations belirler

  # ── State ──────────────────────────────────────────────────────────────────
  flutter_riverpod: ^3.5.0 # ViewModel'ler (@riverpod Notifier)
  riverpod_annotation: ^4.0.8 # @riverpod işaretleri (üretici: riverpod_generator)
  equatable: ^2.1.0 # State eşitliği. 3.x değil: Firebase test paketleri ^2 ister

  # ── Bağımlılık yönetimi (DI) ───────────────────────────────────────────────
  get_it: ^9.3.0 # servis ve repository kayıtları (lib/core/di)

  # ── Yönlendirme ────────────────────────────────────────────────────────────
  go_router: ^18.1.4 # typed rotalar, /admin koruması (üretici: go_router_builder)
  flutter_web_plugins: # temiz adresler (usePathUrlStrategy)
    sdk: flutter

  # ── Arayüz ─────────────────────────────────────────────────────────────────
  flutter_svg: ^2.3.2 # hazır IconData'sı olmayan ikonlar ve logolar (TfIcons)

  # ── Platform ───────────────────────────────────────────────────────────────
  url_launcher: ^6.3.3 # sosyal medya ve e-posta bağlantıları
  image_picker: ^1.2.4 # admin panelinde görsel seçme

  # ── Veri katmanı (yerel paket) ─────────────────────────────────────────────
  tf_data: ^0.1.0 # modeller, repository'ler, servisler (packages/tf_data)

  # ── Firebase (backend fazı) ────────────────────────────────────────────────
  # Backend fazında `flutter pub add` ile eklenecek:
  #   firebase_core        Firebase başlatma
  #   firebase_app_check   herkese açık form ve okuma uçları için bot/spam koruması
  # Firestore / Auth / Storage doğrudan buraya eklenmez; packages/tf_data içinde yaşar.

dev_dependencies:
  # ── Test ───────────────────────────────────────────────────────────────────
  flutter_test:
    sdk: flutter

  # ── Kod üretimi (bash tool/codegen.sh) ─────────────────────────────────────
  build_runner: ^2.15.1 # üreticileri çalıştırır
  riverpod_generator: ^4.0.10 # @riverpod → *.g.dart
  go_router_builder: ^4.5.0 # typed rotalar → *.g.dart
  # Sabitleme (gerekçeli): source_helper 1.4.0, go_router_builder 4.5.0 ile aynı adlı uzantıyı
  # tanımlıyor ve build_runner derlenmiyor. Düzeltmeyi içeren go_router_builder >=4.5.2 Dart >=3.13
  # istiyor. Dart 3.13'e geçilince bu satırı sil ve `flutter pub upgrade go_router_builder` çalıştır.
  source_helper: '>=1.3.13 <1.4.0'
  # json_serializable kökte yok: modeller packages/tf_data içinde üretilir.

  # ── Lint ───────────────────────────────────────────────────────────────────
  very_good_analysis: ^10.3.0 # analysis_options.yaml bunu include eder

flutter:
  uses-material-design: true
  generate: true # gen-l10n (l10n.yaml → lib/l10n/app_localizations*.dart)

  assets:
    - assets/images/ # logo
    - assets/mock/ # sahte veri (ENV=mock); arayüz fazı

  # Inter gömülüdür (D-20); 700 ağırlığı yok (docs/decisions.md → Açık konular).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
