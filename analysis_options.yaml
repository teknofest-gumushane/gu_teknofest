# very_good_analysis + proje kuralları. Yerel paketler (packages/*) bu dosyayı include eder.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.gen.dart"
    - "lib/l10n/app_localizations*.dart"
    - "build/**"
    # Araç öz-testi fixture'ları: kasıtlı ihlal içeren sahte proje ağaçları.
    - "tool/test/fixtures/**"
    - web/**

linter:
  rules:
    # ── Gerekçeli gevşetmeler ──
    # İç uygulama; dışa açılan API yok.
    public_member_api_docs: false
    # Typed rota tanımları, ARB çağrıları ve Türkçe metinler 80 sütunu aşar; dart format sarar.
    lines_longer_than_80_chars: false
    # pubspec bağımlılıkları alfabeye göre değil amaca göre gruplanır.
    sort_pub_dependencies: false
    # copyWith ve iç yardımcılarda konumsal bool kabul edilir.
    avoid_positional_boolean_parameters: false
    # ViewModel mutasyonları setter ile değil metotla yapılır.
    use_setters_to_change_properties: false

    # ── Sertleştirmeler ──
    avoid_print: true
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_empty_else: true
    prefer_const_constructors: true
    sort_constructors_first: true
